name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop
  # lets you re-run the pipeline by hand from the Actions tab
  workflow_dispatch:

# Cancel a previous run of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version is derived from the git history, so the full history
          # and the tags are needed.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pillow

      - name: Run the test suite
        run: python -m pytest tests/ -v --tb=short

  version:
    name: version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The version must resolve from the git history
        run: python tools/check_version.py
